name: ess-project-env
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # Core numerics and IO
  - numpy=2.1
  - pandas>=2.2
  - scipy>=1.11
  - xarray>=2024.0
  - netcdf4>=1.6
  - cftime
  - h5netcdf
  - pyarrow
  - dask
  - distributed

  # Geospatial stack (keep on conda-forge to avoid ABI conflicts)
  - proj=9.4.*
  - proj-data
  - pyproj=3.6.1
  - gdal>=3.9
  - geopandas>=1.0
  - rasterio>=1.3,<1.4
  - rioxarray>=0.18,<0.19
  - shapely>=2.0
  - fiona>=1.10
  - pyogrio>=0.10
  - rasterstats>=0.19
  - contextily

  # Forcing acquisition and processing
  - cdsapi
  - ecmwf-datastores-client
  - pydaymet>=0.19
  - pykrige>=1.7
  - metsim>=2.4
  - requests

  # Modeling and optimization support
  - scikit-learn>=1.5
  - salib>=1.5
  - mpi4py>=3.1

  # Visualization and notebooks
  - matplotlib>=3.8
  - seaborn
  - plotly
  - ipykernel
  - jupyterlab

  # Project runtime utilities
  - pyyaml>=6.0
  - python-dotenv>=1.0
  - psutil>=6.0
  - tqdm>=4.66
  - alive-progress>=3.1
  - cdo

  # Optional R bridge used in some workflows
  - r-base
  - rpy2

  # Test/docs parity with repo requirements
  - pytest>=8.0
  - sphinx>=7.0

  - pip:
      # Keep pip-only packages here. Avoid pip installs of geopandas/rasterio/pyproj/fiona.
      - torch>=2.4.1
      - pyswarms
      - pyviscous
      - easymore
      - metloom
      - pysheds>=0.4
      - hydrobm>=1.0.0
      - baseflow
      - hs_restclient
      - git+https://github.com/kasra-keshavarz/meshflow.git
