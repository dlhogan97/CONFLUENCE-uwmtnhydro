# ============================================================================
# Stage 1: Snow Accumulation, Distribution, and Melt
# ============================================================================
# Goals
# -----
# 1. Reproduce the ASO-observed hypsometric distribution of April-1 SWE.
#    Modeled SWE has historically been ~300 m too high in elevation; this
#    stage corrects the spatial shape via per-HRU spatial weights on
#    `frozenPrecipMultip`.
# 2. Get melt timing right via per-HRU `LWRadAtm` boost (top 4 HRUs > bottom).
# 3. Capture warm AR-event rain at low elevations via `tempCritRain` (a
#    further low-elev temp delta is calibrated in stage 3 against streamflow).
#
# Levers (priority order)
# -----------------------
#   frozenPrecipMultip — global multiplier × ASO-derived per-HRU weights.
#                        Effective per-HRU value = base × ASO_weight × M.
#                        Concentrates snow accumulation at the elevations ASO
#                        actually observes it.
#   lw_mult            — basin-wide multiplier with spatial weights that boost
#                        LW at high HRUs (where over-accumulation has been
#                        worst).  Forcing-side (applied to LWRadAtm).
#   tempCritRain       — global rain/snow threshold multiplier.
#
# Fixed (NOT calibrated this stage)
# ----------------------------------
#   albedoDecayRate at 4.19e+5 s (~5 days) — set in base trialParams.nc.
#
# Constraints
# -----------
#   SNOTEL SWE at Butte (CO:380, 2930 m) — point KGE
#   ASO median April-1 SWE-by-elevation shape — hypsometric cosine similarity
# ============================================================================

name: stage1_snow
description: "Snow accumulation, hypsometric redistribution, and melt timing"

params:
  - frozenPrecipMultip
  - tempCritRain
  - lw_mult            # forcing-side; per-HRU via spatial weights below

# Forcing-side multipliers — applied to LWRadAtm in METSIM forcing files,
# NOT to trialParams.nc.  Listed here so the trial loop routes them correctly.
forcing_params:
  - lw_mult

# Spatial weights — per-HRU directional shape; the optimizer tunes the global
# magnitude.  Effective value at HRU i = base × spatial_weight_i × M.
spatial_weights:
  # ASO median April-1 SWE normalized to basin mean (data-driven prior).
  # Floor of 0.25 applied at the bottom 2 HRUs (1697, 1396 m) — snow there
  # should be rare but not literally zero.
  frozenPrecipMultip:
    0: 1.333    # 3681 m
    1: 1.704    # 3389 m
    2: 1.833    # 3060 m  (peak)
    3: 1.501    # 2747 m
    4: 1.052    # 2415 m
    5: 0.404    # 2061 m
    6: 0.25     # 1698 m  (floored from ASO 0.133)
    7: 0.25     # 1396 m  (floored from ASO 0.040)
  # LW boost concentrated at the top 4 HRUs to accelerate over-accumulated melt.
  lw_mult:
    0: 1.0      # 3681 m  (top 4)
    1: 1.0      # 3389 m
    2: 1.0      # 3060 m
    3: 1.0      # 2747 m
    4: 0.4      # 2415 m  (bottom 4)
    5: 0.4      # 2061 m
    6: 0.4      # 1698 m
    7: 0.4      # 1396 m

anchor_variable: scalarSWE
coherence_type: snow

# Anchor metric used for the SNOTEL site comparison; full anchor cost is
# blended with hypsometric coherence (controlled by run_cfg.aso_anchor_weight).
anchor_metric: NRMSE

# Coherence weight (1 - w_anchor) handles the across-HRU shape consistency.
w_anchor: 0.7

# Multiplier search bounds [lo, hi] applied on top of base × spatial_weight.
multiplier_search_bounds:
  frozenPrecipMultip: [0.3,  1.4]   # widened: optimizer needed to push lower
  tempCritRain:       [0.985, 1.015]   # ~±4 K spread for AR-event capture
  lw_mult:            [1.0,  1.2]   # +0% to +20% LW (top 4 full, bottom 4 moderated by spatial weight)

# Optimizer settings — looser tol + smaller pop for faster convergence.
# Total max evals = max_iterations × popsize × n_params = 25 × 5 × 3 = 375.
max_iterations: 25
popsize: 5
tol: 0.02

spinup_days: 365
time_step_hours: 1.0

# Optional warm-start: re-set in the optimization config wrapper.
# warm_start_from: /scratch/.../staged_results_bigBuckt_lumped/final_best_params.json
