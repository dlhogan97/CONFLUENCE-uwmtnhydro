# ============================================================================
# Stage 1: Snow Accumulation and Melt
# ============================================================================
# Goal: Correct snow accumulation, peak timing, melt rate, and disappearance.
#
# Parameters are calibrated as global multipliers on the per-HRU base values
# from trialParams.nc.  Physical bounds are enforced after multiplication in
# parameter_manager.py.
#
# Physical reasoning:
#   albedoDecayRate — controls how fast albedo decays after fresh snowfall.
#                     SUMMA default (~3e6 s) can be too slow for dusty Colorado
#                     snowpack.  Optimizer often prefers ~1e5 (non-physical).
#                     Clamp lower bound to 1e5 s.
#   Frad_direct     — partitions direct vs diffuse shortwave.  Higher elevation
#                     → more direct; East River sits at 2700–4000 m.
#   Frad_vis        — partitions visible vs NIR.  Controls albedo feedback.
#
# Constrained by:
#   SNOTEL SWE at Butte (SNTL:CO:380) ~2930 m and Schofield Pass (SNTL:CO:737) ~3260 m
# ============================================================================

name: stage1_snow
description: "Snow accumulation, albedo decay, shortwave partitioning"

params:
  - albedoDecayRate
  - frozenPrecipMultip

anchor_variable: scalarSWE
coherence_type: snow

# Objective weights (w_anchor + w_coherence = 1.0)
# Use high coherence weight because we only have 1–2 SNOTEL sites for ~8 HRUs.
w_anchor: 0.4

# Multiplier search bounds [lo, hi] — applied on top of the base parameter value.
# albedoDecayRate: wide range because the physical range is 1e5–3e6 s (3 orders of magnitude).
multiplier_search_bounds:
  albedoDecayRate:    [0.5, 1.5]   # tightened from prior best (0.35) ±50%
  # Frad_direct:        [0.90, 1.40]   # prior best 1.12; physically near 1.0
  # Frad_vis:           [1.00, 1.55]   # prior best 1.27; East River gets high vis fraction
  frozenPrecipMultip: [0.8, 1.2]   # prior best 1.15; 

# Optimizer settings
max_iterations: 75
popsize: 10            # differential_evolution: pop = popsize × n_params = 5×4 = 20 members
tol: 0.005

spinup_days: 365
time_step_hours: 1.0
