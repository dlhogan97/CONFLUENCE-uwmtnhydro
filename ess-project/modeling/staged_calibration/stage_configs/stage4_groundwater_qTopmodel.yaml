# ============================================================================
# Stage 3: Subsurface Lateral Flow and Groundwater (qTopmodl)
# ============================================================================
# Goal: Constrain subsurface drainage, lateral flow connectivity, and baseflow
#       recession under the TOPMODEL groundwater scheme (groundwatr = qTopmodl).
#       Snow and ET parameters are FROZEN from stages 1–2.
#
# Use this file INSTEAD of stage3_groundwater.yaml when modelDecisions.txt has:
#   groundwatr  qTopmodl
#
# When using this stage, remove k_soil from stage2_soil_et.yaml's params list
# and multiplier_search_bounds to avoid double-calibrating it.
#
# Physical reasoning:
#   k_soil           — saturated hydraulic conductivity (vertical, m/s).  With
#                       qTopmodel, vertical K controls the rate of drainage into
#                       the lateral flow system.  ROSETTA sandy loam: ~4e-5 m/s.
#                       Moved here from stage 2 because k_soil and zScale_TOPMODEL
#                       are tightly coupled in the TOPMODEL transmissivity function.
#   kAnisotropic     — ratio of horizontal to vertical Ksat (dimensionless).
#                       TOPMODEL lateral flow scales as T = k_soil × kAnisotropic
#                       × zScale_TOPMODEL.  Layered soils (forest) have higher
#                       anisotropy (stratified organic horizons); rocky alpine has
#                       near-isotropic, fracture-dominated flow (~1).
#                       Default: 1.0; physical range: 0.001–10.
#   fieldCapacity    — volumetric water content at which gravity drainage equals
#                       capillary retention.  Controls the transition from
#                       unsaturated to saturated conditions that triggers TOPMODEL
#                       saturation excess.  ROSETTA sandy loam: ~0.20.
#                       Physical range: 0.05–0.5.
#   zScale_TOPMODEL  — exponential depth scale for transmissivity decay (m).
#                       T(z) = T₀ × exp(−z / zScale_TOPMODEL).
#                       Large value → deeper, more buffered groundwater response
#                       (fractured rock, East River deep aquifer: 5–30 m plausible).
#                       Small value → thin soil, flashy recession.
#                       Default: 2.5 m; physical range: 0.1–100 m.
#
# Parameter interactions:
#   Baseflow magnitude: k_soil × kAnisotropic × zScale_TOPMODEL (transmissivity)
#   Baseflow timing:    zScale_TOPMODEL (larger = slower, more buffered recession)
#   Saturation excess:  fieldCapacity + qSurfScale (qSurfScale frozen from stage 2)
#
# Constrained by:
#   - Eckhardt-filtered baseflow from observed streamflow
#     (streamflow_obs.csv; columns: date, value [m³/s])
#   - Baseflow index target range 0.3–0.7 for East River
#   - Recession curve slope (log-linear)
# ============================================================================

name: stage3_groundwater_qTopmodel
description: "Subsurface lateral flow (qTopmodl): k_soil, kAnisotropic, fieldCapacity, zScale_TOPMODEL"

params:
  # - k_soil
  - kAnisotropic
  - qSurfScale
  # - fieldCapacity
  - zScale_TOPMODEL

# ── Spatial weights ────────────────────────────��────────────────────────────
# MODIS codes: 16 = barren/sparsely vegetated, 7 = open shrublands,
#              1 = evergreen needleleaf forest
#
# Physical reasoning per parameter:
#   k_soil:          rocky alpine substrate → lower Ksat; forest soils → higher
#   kAnisotropic:    forest layered horizons → more anisotropic (horiz > vert);
#                    rocky alpine → near isotropic (fracture-dominated)
#   fieldCapacity:   richer organic soils (forest) retain more water before
#                    draining; rocky alpine coarser, drains at lower theta
#   zScale_TOPMODEL: depth of contributing aquifer tracks soil development;
#                    rocky alpine thin, forest/shrub deeper
spatial_weights:
  # k_soil:
  #   16: 0.55    # barren rocky substrate → lower Ksat (~2.2e-5 m/s)
  #   1:  1.50    # evergreen forest soils → higher Ksat (~6.0e-5 m/s)
  #   7:  1.00    # open shrublands reference (~4.0e-5 m/s)
  kAnisotropic:
    16: 1.0    # rocky alpine — fracture-dominated, near-isotropic
    1:  0.5    # evergreen forest — layered organic horizons, higher H:V ratio
    7:  0.10    # open shrublands reference
  qSurfScale:
    16: 1.0    # barren rocky → more saturation-excess surface runoff
    1:  0.75    # forest — infiltration buffers surface runoff
    7:  1.0    # shrublands — lower surface runoff than barren
  # fieldCapacity:
  #   16: 0.80    # coarser rocky substrate → lower field capacity
  #   1:  1.10    # organic-rich forest soils → higher field capacity
  #   7:  1.00    # open shrublands reference
  zScale_TOPMODEL:
    16: 1.0    # thin rocky alpine soils → shallow effective aquifer depth
    1:  1.0    # deeper soil development under forest canopy
    7:  1.0    # open shrublands reference

anchor_variable: averageRoutedRunoff   # per-GRU aquifer/lateral baseflow flux
coherence_type: streamflow
anchor_metric: KGE_log               # log-KGE emphasizes recession limb over melt peak

# Note: if scalarAquiferBaseflow is not written for qTopmodl runs, check
# outputControl.txt.  If unavailable, switch coherence_type to "streamflow"
# and the anchor will compare total routed runoff to Eckhardt-filtered obs.
w_anchor: 0.6

multiplier_search_bounds:
  # k_soil:          [0.15, 0.65]   # prior best (bigBuckt) 0.33; keep moderate range
  qSurfScale:      [0.5, 2.0]
  kAnisotropic:    [0.10, 3.0]    # wide: anisotropy highly uncertain; default=1.0
  # fieldCapacity:   [0.50, 2.50]   # ~0.10–0.50 m³/m³ physically; multiplier on 0.20
  zScale_TOPMODEL: [1.0, 2.0]

max_iterations: 75
popsize: 10            # pop = 5 × 4 params = 40 members
tol: 0.005

spinup_days: 365
time_step_hours: 1.0
