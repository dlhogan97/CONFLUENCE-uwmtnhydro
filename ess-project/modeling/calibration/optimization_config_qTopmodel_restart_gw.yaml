  param_nc_filename: trialParams.nc

  output_prefix: qTopmodl_elevation

  model_decisions_override:
    groundwatr: qTopmodl
    bcLowrSoiH: zeroFlux
    hc_profile: pow_prof
    stomResist: Jarvis

  timeout_sec: 1800
  parallel_workers: 8
  random_seed: 42
  spinup_days: 365

  sim_start: "2013-10-01 00:00"
  sim_end:   "2017-09-30 23:00"

  time_step_hours: 1.0
  basin_area_m2: 774515414.59
  n_hru: 8

  # Use stage1-frozen forcing (LW correction already applied).
