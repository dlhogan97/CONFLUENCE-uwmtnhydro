# ============================================================================
# optimization_config_qTopmodel_restart_gw.yaml
# Restart from stage2_et frozen params — re-runs only the GW stage with:
#   - k_soil added back (was commented out)
#   - wider zScale_TOPMODEL bounds [0.5, 5.0]
#   - MONTHLY_TOTAL_COM anchor metric (replaces KGE_log)
#   - 30 max iterations, tol=0.01
# ============================================================================

log_level: INFO

results_dir: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/optimization/staged_results_qTopmodel_gw_restart

stage_configs_dir: /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/calibration/stage_configs

stages:
  - /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/calibration/stage_configs/stage4_groundwater_qTopmodel.yaml

run:
  summa_exe: summa

  summa_settings_dir: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/settings/SUMMA

  # Start from stage2_et frozen params — snow + ET already optimized.
