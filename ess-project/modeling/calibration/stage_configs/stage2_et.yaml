# ============================================================================
# Stage 2: Evapotranspiration
# ============================================================================
# Goal: Correct the seasonal ET cycle — timing, magnitude, and land-cover
#       partitioning between forest, shrub, and barren bands.
#       Snow parameters are FROZEN from stage 1.
#
# Physical reasoning:
#   rootingDepth  — controls how deep roots can extract soil water.  Alpine
#                   barren/rocky: ~0.2–0.5 m; evergreen forest: 1–3 m.
#                   Primary control on growing-season ET magnitude.
#
# Add additional ET-controlling parameters below as you identify them:
#   (e.g. stomatal resistance, LAI multipliers, wilting point, etc.)
#
# Constrained by:
#   - Monthly gridded ET from OpenET (observations/et_obs.csv)
#   - anchor_metric controls which skill score is minimised
# ============================================================================

name: stage2_et
description: "Evapotranspiration: rooting depth and ET process controls"

params:
  - rootingDepth
  - minStomatalResistance
  # - critSoilTranspire
  # - critSoilWilting
  # Add more ET params here as needed:
  # - theta_res
  # - leafScaleFactor (if using canopy scaling)

# ── Spatial weights ─────────────────────────────────────────────────────────
# MODIS land cover codes from hru_landcover in optimization_config:
#   16 = barren/sparsely vegetated
#    8 = open shrublands
#    1 = evergreen needleleaf forest
spatial_weights:
  rootingDepth:
    16: 0.40    # alpine barren/rocky — shallow (~0.4 m)
    1:  1.50    # evergreen forest — deep roots (~1.5 m)
    7:  1.00    # open shrublands — reference depth (~1.0 m)
  minStomatalResistance:
    16: 1.0    # alpine barren/rocky — shallow (~0.4 m)
    1:  1.0    # evergreen forest — deep roots (~1.5 m)
    7:  1.00    # open shrublands — reference depth (~1.0 m)
  # minStomatalResistance:
  #   16: 1.00    # alpine plants may have higher stomatal resistance
  #   1:  1.00    # forest plants may have lower stomatal resistance
  #   7:  1.00    # shrublands — reference
  # critSoilTranspire:
  #   16: 0.80    # alpine plants may stop transpiring at higher soil moisture (adapted to dry conditions)
  #   1:  0.85    # forest plants may keep transpiring at lower soil moisture (buffered by deeper roots)
  #   7:  1.00    # shrublands — reference
  # critSoilWilting:
  #   16: 0.60    # alpine plants may wilt at higher soil moisture (less drought-tolerant)
  #   1:  0.80    # forest plants may wilt at lower soil moisture (more drought-tolerant)
  #   7:  1.00    # shrublands — reference

anchor_variable: scalarTotalET
coherence_type: et

# anchor_metric: metric used to score simulated vs observed ET.
# Options: KGE | KGE_log | NSE | NRMSE
anchor_metric: NSE

# Higher anchor weight — OpenET gridded estimates spatially dense and reliable.
w_anchor: 0.55

multiplier_search_bounds:
  rootingDepth: [0.25, 4.0]   # barren floor ~0.1m, deep forest up to 3m
  minStomatalResistance: [0.7, 1.5]
  # critSoilTranspire: [0.7, 1.5]
  # critSoilWilting: [0.7, 1.5]


max_iterations: 25
popsize: 5           # pop = 5 × 2 params = 10 members per gen
tol: 0.02

spinup_days: 365
time_step_hours: 1.0
