# ============================================================================
# Stage 4: Hillslope Routing (distributed mode only)
# ============================================================================
# Goal: Match routed hydrograph shape, peak timing, and volume at the outlet.
#       All non-routing parameters are frozen from previous stages.
#
# Physical reasoning:
#   routingGammaShape — shape parameter of the Gamma distribution for the
#                       time-delay routing (subRouting = timeDlay).
#                       Higher shape → more peaked, less spread response.
#                       Typical mountain values: 2–4.
#   routingGammaScale — scale parameter (seconds).  Controls mean travel time.
#                       East River length ~50 km, v ~0.5 m/s → ~28 hours.
#                       routingGammaScale ≈ 3600–86400 s is physically reasonable.
#
# Note: This stage uses averageRoutedRunoff (the basin-aggregated, routed
#       output) for comparison against outlet streamflow.  This is the ONLY
#       stage where routing output is compared to observations.
#
# Constrained by:
#   - Outlet streamflow at USGS 09112500 (East River at Almont, CO)
#     observations/streamflow_obs.csv, columns: date, value [m³/s]
# ============================================================================

name: stage4_routing
description: "Hillslope time-delay routing: Gamma shape and scale"

params:
  - routingGammaShape
  - routingGammaScale

anchor_variable: averageRoutedRunoff   # basin-aggregated routed runoff
coherence_type: streamflow             # no HRU coherence for routing; pure anchor

# Routing is pure anchor — there's no meaningful coherence metric across HRUs.
w_anchor: 0.9

# Base values in trialParams.nc (gru dim):
#   routingGammaShape = 2.5  →  search range [0.5×2.5=1.25, 3×2.5=7.5] ✓ within [1,10]
#   routingGammaScale = 46000 s →  search range [0.3×46k=13.8k, 2.0×46k=92k s] ✓ within [500,172800]
multiplier_search_bounds:
  routingGammaShape: [0.25,  2.0]
  routingGammaScale: [0.3,  2.0]   # upper limit keeps scale below physical max (172800 s)

max_iterations: 75
popsize: 5            # pop = 5 × 2 = 10 members; routing is fast, tight search
tol: 0.002

spinup_days: 365
time_step_hours: 1.0
