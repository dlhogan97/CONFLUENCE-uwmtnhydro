# ============================================================================
# Stage 3: Groundwater and Baseflow
# ============================================================================
# Goal: Match baseflow recession, storage buffering, and low-flow behavior.
#       Snow and soil parameters are FROZEN from stages 1–2.
#
# Physical reasoning:
#   aquiferScaleFactor   — storage scale of the bigBucket aquifer (m).
#                          Controls how much total water the aquifer can hold.
#                          East River has deep fractured rock; large scale factor
#                          (10–50 m) is plausible.
#   aquiferBaseflowExp   — nonlinearity of baseflow Q = k × S^exp.
#                          exp=1 → linear reservoir; exp>1 → convex recession.
#                          Typical mountain catchments: 1.5–3.0.
#   aquiferBaseflowRate  — baseflow rate at storage = scaleFactor (m/s).
#                          This is the drainage coefficient at 'normal' storage.
#
# IMPORTANT: Use pre-routing variables for diagnostics.
#   Compare scalarAquiferBaseflow / scalarTotalRunoff at HRU level.
#   Do NOT compare scalarTotalRunoff directly to streamflow observations.
#
# Constrained by:
#   - Eckhardt-filtered baseflow from observed streamflow
#     (observations/streamflow_obs.csv, columns: date, value [m³/s])
#   - Recession curve slope (log-linear)
#   - Baseflow index range 0.3–0.7 for East River
# ============================================================================

name: stage3_groundwater
description: "Groundwater and baseflow recession: bigBucket aquifer parameters"

# These are GRU-level (basin-wide) parameters from basinParamInfo.txt.
# They govern the explicit bucket aquifer for groundwatr = bigBuckt.
# No spatial weights needed — they are inherently basin-scale.
params:
  - aquiferScaleFactor
  - aquiferBaseflowExp
  - aquiferBaseflowRate

anchor_variable: averageRoutedRunoff
coherence_type: runoff
anchor_metric: MONTHLY_TOTAL_COM

# Anchor to total streamflow (not Eckhardt baseflow) so GW params refine recession
# timing and buffering without fighting the already-calibrated soil stage.
w_anchor: 0.7

multiplier_search_bounds:
  aquiferScaleFactor:   [0.2, 5.0]
  aquiferBaseflowExp:   [0.3, 3.0]
  aquiferBaseflowRate:  [0.1, 10.0]

max_iterations: 30
popsize: 6             # pop = 6 × 3 = 18 members per gen
tol: 0.01

spinup_days: 365
time_step_hours: 1.0
