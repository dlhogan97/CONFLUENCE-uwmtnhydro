# ============================================================================
# optimization_config_noXplicit.yaml — Master config for staged distributed calibration
# East River basin, Colorado (groundwatr = noXplict workflows)
# ============================================================================

# ---- Logging ---------------------------------------------------------------
log_level: INFO   # DEBUG | INFO | WARNING

# ---- Results output --------------------------------------------------------
results_dir: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/optimization/staged_results_noXplict

# ---- Stage config files (run in order; each freezes params before next) ----
stage_configs_dir: /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/staged_calibration/stage_configs

stages:
  - /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/staged_calibration/stage_configs/stage1_snow.yaml
  - /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/staged_calibration/stage_configs/stage2_et.yaml
  - /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/staged_calibration/stage_configs/stage3_soil.yaml
  # Groundwater stage intentionally omitted for noXplict workflows.
  # - /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/staged_calibration/stage_configs/stage5_routing.yaml

# ---- Run configuration -----------------------------------------------------
run:
  # SUMMA executable
  summa_exe: summa

  # Base SUMMA settings directory to copy for each trial.
  # This should be a fully-preprocessed settings dir (fileManager.txt + all inputs).
  summa_settings_dir: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/settings/SUMMA

  # Base trialParams file with a-priori per-HRU parameter values.
  # This is the file that multipliers are applied to.
  base_trial_params_nc: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/settings/SUMMA/trialParams.nc

  # Optional: seed initial parameter values from calib_bounds_multiHRU.json
  # `value` fields before stage multipliers are applied.
  # base_calib_bounds_json: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/settings/SUMMA/calib_bounds_multiHRU.json

  # Filename of the trial params file as SUMMA expects it.
  param_nc_filename: trialParams.nc

  # SUMMA output file prefix — patched into fileManager.txt for every trial.
  output_prefix: noXplicit_elevation

  # Patch modelDecisions.txt for every trial — overrides bigBuckt base settings.
  model_decisions_override:
    groundwatr: noXplict
    bcLowrSoiH: drainage

  # Timeout per SUMMA run in seconds (30 min = 1800 s).
  timeout_sec: 1800

  # Number of parallel workers for differential_evolution.
  # Set to -1 to use all available CPUs, or 1 for sequential (easier debugging).
  parallel_workers: 6

  # Random seed for reproducibility.
  random_seed: 42

  # Spin-up days to trim from the start of each SUMMA output before computing metrics.
  spinup_days: 365

  # Calibration period: WY2014 spinup + WY2015 dry / WY2016 normal / WY2017 wet
  sim_start: "2013-10-01 00:00"
  sim_end:   "2017-09-30 23:00"

  # SUMMA output time step in hours.
  time_step_hours: 1.0

  # Basin area in m² — sum of HRUarea from attributes.nc (8 HRUs).
  basin_area_m2: 774515414.59

  # Number of HRUs in the discretization (matches attributes.nc).
  n_hru: 8

  # Base forcing directory.  When stage 1 calibrates lw_mult, the freeze step
  # writes a stage1_frozen_forcing/ alongside results and re-points this for
  # downstream stages.
  base_forcing_dir: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/forcing/SUMMA_input

  # Shared two-reservoir routing parameters (k_fast, k_slow, f_fast).
  # Generated by pre_calibrate_routing.py from a single uncalibrated bigBuckt
  # baseline run; identical across noXplict / bigBuckt / qTopmodel so physics
  # comparison isn't confounded by per-model routing.
  routing_params_json: /home/dlhogan/projects/forked-repos/CONFLUENCE-uwmtnhydro/ess-project/modeling/staged_calibration/routing_params_shared.json

  # ASO median April-1 SWE normalized to basin mean — used as the hypsometric
  # coherence reference shape in stage 1 (cosine-similarity cost on shape).
  # Same 8-HRU mapping as attributes.nc.  Floor 0.25 at HRUs 6, 7.
  aso_swe_weights:
    0: 1.333    # 3681 m
    1: 1.704    # 3389 m
    2: 1.833    # 3060 m
    3: 1.501    # 2747 m
    4: 1.052    # 2415 m
    5: 0.404    # 2061 m
    6: 0.25     # 1698 m  (floored)
    7: 0.25     # 1396 m  (floored)
  # Blend weight for ASO hypsometric vs SNOTEL anchors in stage 1.  0.5 = equal.
  aso_anchor_weight: 0.5

  # ---------------------------------------------------------------------------
  # HRU spatial metadata — elevation-only discretization (8 HRUs)
  # ---------------------------------------------------------------------------
  # HRU ordering follows attributes.nc hruId order (1..8).
  # Keys are zero-based HRU indices as returned by read_hru_output.

  hru_elevations:
    0: 3681.40773653947
    1: 3388.73623228869
    2: 3060.45401723102
    3: 2747.47577744648
    4: 2414.93972506168
    5: 2061.12491574927
    6: 1697.64594875346
    7: 1396.12108886108

  # No aspect discretization for the elevation-only domain
  hru_aspects: {}

  # HRU land cover by HRU index (MODIS vegTypeIndex from attributes.nc)
  # 16=barren/sparsely vegetated, 7=open shrublands, 1=evergreen needleleaf forest
  hru_landcover:
    0: 16
    1: 16
    2: 7
    3: 1
    4: 7
    5: 7
    6: 7
    7: 1

   # SNOTEL anchor sites for snow stage.
  # Each site anchors the HRU whose elevation is closest to the station.
  # KGE is computed per site then averaged for the anchor cost.
  snotel_sites:
    - elevation: 2930.0
      obs_path: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/observations/formatted/snotel_swe.csv

  # Path to observed streamflow for baseflow and routing stages.
  # Columns: date (YYYY-MM-DD), value (m³/s)
  streamflow_obs_path: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/observations/formatted/streamflow_obs.csv

# ============================================================================
# Observation file format notes
# ============================================================================
# All CSVs must have at minimum two columns:
#   date   — YYYY-MM-DD format
#   value  — numeric, SI units
#
# observations/snotel_swe.csv    — daily SWE in mm (SNOTEL Butte or Schofield Pass)
# observations/streamflow_obs.csv — daily Q in m³/s (USGS 09112500 East River at Almont)
# observations/et_open_et.csv    — monthly ET in mm/month (OpenET gridded product)
#
# Download scripts:
#   SNOTEL:     curl "https://wcc.sc.egov.usda.gov/reportGenerator/view_csv/customSingleStationReport/..."
#   USGS:       python -c "import dataretrieval.nwis as nwis; ..."
#   OpenET:     via OpenET API or Earth Engine

observations:
  swe_obs_path: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/observations/formatted/snotel_swe.csv
  et_obs_path: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/observations/formatted/et_obs.csv
  streamflow_obs_path: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_distributed_elev/observations/formatted/streamflow_obs.csv

# Per-stage warm-start: seed DE's first member from the lumped run's best
# multipliers.  noXplict_drainage_lumped is the closest physics analog.
warm_start_paths:
  stage1_snow: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_lumped/optimization/staged_results_noXplict_drainage/final_best_params.json
  stage2_et:   /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_lumped/optimization/staged_results_noXplict_drainage/final_best_params.json
  stage3_soil: /scratch/dlhogan/ess-project-data/domain_Tuolumne_River_lumped/optimization/staged_results_noXplict_drainage/final_best_params.json
